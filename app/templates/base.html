<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Almanac Grid{% endblock %}</title>
  <style>
    :root { --ink: #1c2530; --muted: #5d6b7a; --line: #d9dee4; --bg: #f7f8fa; --accent: #1f5f8b; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
    header { background: #fff; border-bottom: 1px solid var(--line); }
    header .inner, main { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
    header .inner { display: flex; align-items: baseline; gap: 24px; padding-top: 14px; padding-bottom: 14px; }
    header strong { font-size: 18px; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    main { padding-top: 24px; padding-bottom: 48px; }
    h1 { font-size: 24px; margin: 0 0 4px; }
    h2 { font-size: 17px; margin: 32px 0 8px; }
    .muted { color: var(--muted); }
    .table-wrap { overflow-x: auto; background: #fff; border: 1px solid var(--line); border-radius: 6px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
    td.wrap { white-space: normal; }
    th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    tr:last-child td { border-bottom: 0; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    form.filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; margin: 16px 0; }
    form.filters label { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); gap: 4px; }
    input, select, button { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; background: #fff; }
    button { background: var(--accent); color: #fff; border-color: var(--accent); cursor: pointer; }
    .outcome { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; background: #e8ebef; }
    .outcome.approved { background: #d9efdf; color: #1d6b35; }
    .outcome.denied { background: #f6dada; color: #8c2222; }
    .outcome.withdrawn { background: #f3e8cf; color: #7a5a10; }
    .outcome.outcome_unclear { background: #e1e6f4; color: #34457a; }
    .chart { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 16px; height: 340px; }
    .pager { display: flex; gap: 16px; align-items: center; margin-top: 12px; }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 12px 0; }
    dt { color: var(--muted); }
    dd { margin: 0; }
  </style>
</head>
<body>
  <header>
    <div class="inner">
      <strong>Almanac Grid</strong>
      <a href="/">Trends</a>
      <a href="/ui/projects">Projects</a>
    </div>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
